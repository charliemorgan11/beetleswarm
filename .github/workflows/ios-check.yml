name: iPhone build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare offline game and run regression checks
        run: |
          node scripts/prepare-ios.mjs
          node --test tests/engine.test.mjs tests/ios-package.test.mjs
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Compile unsigned iPhone simulator app
        run: |
          xcodebuild build \
            -project ios/BeetleSwarm.xcodeproj \
            -scheme BeetleSwarm \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO
