<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beetle Swarm">
  <title>Beetle Swarm</title>
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/charliemorgan11/beetleswarm/f09fab79a49f6c0fa0ff0e03f19f6017fae281ea/dist/assets/beetle-swarm-icon.png">
  <style>html,body{min-height:100%;margin:0;background:#302017;color:#ead2a0;font-family:Georgia,serif}#loading{min-height:100dvh;display:grid;place-content:center;text-align:center;box-sizing:border-box;padding:24px}h1{font-size:38px;font-weight:normal;margin:0 0 16px}p{line-height:1.6}button{background:#ead2a0;color:#302017;border:0;padding:14px 24px;font:inherit;min-height:48px;cursor:pointer}[hidden]{display:none!important}</style>
</head>
<body>
  <section id="loading" aria-live="polite">
    <h1>Beetle Swarm</h1>
    <p id="loading-message">Unfurling the chart…</p>
    <button id="reload-game" hidden>Try Again</button>
  </section>
  <script>
  (async () => {
    'use strict';
    // Pin all four source files and artwork to the same tested release.
    // The original engine and renderer are executed without gameplay changes.
    const BASE = 'https://raw.githubusercontent.com/charliemorgan11/beetleswarm/f09fab79a49f6c0fa0ff0e03f19f6017fae281ea/dist/';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);
    document.getElementById('reload-game').addEventListener('click', () => location.reload());
    try {
      const text = async path => {
        const response = await fetch(BASE + path, { signal: controller.signal, cache: 'force-cache', credentials: 'omit' });
        if (!response.ok) throw new Error('Could not load ' + path + ' (' + response.status + ')');
        return response.text();
      };
      const [html, css, engine, renderer] = await Promise.all([
        text('index.html'), text('style.css'), text('engine.mjs'), text('game.mjs')
      ]);
      clearTimeout(timeout);
      if (!html.includes('id="head-start"') || !renderer.includes('game.start(25)')) {
        throw new Error('The expected game version was not returned.');
      }
      const page = new DOMParser().parseFromString(html, 'text/html');
      page.querySelectorAll('script, link[rel="stylesheet"], link[rel="manifest"]').forEach(node => node.remove());
      for (const element of page.querySelectorAll('[src], [href]')) {
        for (const name of ['src', 'href']) {
          const value = element.getAttribute(name);
          if (value && value.startsWith('/') && !value.startsWith('//')) element.setAttribute(name, BASE + value.slice(1));
        }
      }
      const style = page.createElement('style');
      style.textContent = css.replace(/url\((['"]?)\/(?!\/)/g, (_, quote) => 'url(' + quote + BASE);
      page.head.appendChild(style);
      const description = page.createElement('meta');
      description.name = 'description';
      description.content = 'Claim the pirate map. More beetles, never faster. Start at Level 1 or take a Head Start to Level 25.';
      page.head.appendChild(description);
      const manifest = {
        id: location.pathname,
        name: 'Beetle Swarm', short_name: 'Beetle Swarm',
        start_url: location.href.split('#')[0],
        scope: new URL('./', location.href).href,
        display: 'standalone', orientation: 'portrait-primary',
        background_color: '#302017', theme_color: '#302017',
        icons: [{ src: BASE + 'assets/beetle-swarm-icon.png', type: 'image/png', sizes: 'any', purpose: 'any' }]
      };
      const manifestLink = page.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      page.head.appendChild(manifestLink);
      document.head.replaceChildren(...Array.from(page.head.childNodes, node => document.importNode(node, true)));
      document.body.replaceChildren(...Array.from(page.body.childNodes, node => document.importNode(node, true)));
      const source = engine.replace(/^export /gm, '') + '\n' + renderer
        .replace(/^import \{ SwarmGame \} from '\.\/engine\.mjs';\s*/, '')
        .replace(/(['"])\/assets\//g, (_, quote) => quote + BASE + 'assets/');
      const script = document.createElement('script');
      script.type = 'module';
      script.textContent = source;
      document.body.appendChild(script);
    } catch (error) {
      clearTimeout(timeout);
      const loading = document.getElementById('loading');
      if (loading) {
        document.getElementById('loading-message').textContent = 'The chart could not load. Check your connection and try again.';
        document.getElementById('reload-game').hidden = false;
      } else {
        const section = document.createElement('section');
        section.id = 'loading';
        const message = document.createElement('p');
        message.textContent = 'The chart could not load. Check your connection and reload the page.';
        section.appendChild(message);
        document.body.replaceChildren(section);
      }
      console.error('Beetle Swarm loading failed:', error);
    }
  })();
  </script>
</body>
</html>
